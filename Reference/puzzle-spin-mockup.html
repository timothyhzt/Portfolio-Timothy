<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puzzle scene mockup</title>
<style>
:root{--navy:#142b3a;--navy-light:#274658;--blue:#7ea5a8;--beige:#f2eadb;--cream:#fbf8f1;--sand:#ded1bb;--pale:#dce9e8;box-sizing:border-box}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--cream);color:var(--navy);font-family:Georgia,'Times New Roman',serif;overflow-x:hidden}
em{color:var(--blue)}
.hero{min-height:100vh;background:var(--navy);color:var(--beige);display:grid;place-content:center;text-align:center;padding:env(safe-area-inset-top,0px) 24px}
.hero h1{font-weight:400;letter-spacing:-.055em;line-height:.96;font-size:clamp(38px,7vw,88px);margin:0 0 28px}
.hero span{font:11px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.scene{position:relative;min-height:100vh;background:var(--pale);display:grid;grid-template-columns:1fr auto;align-items:center;gap:clamp(20px,5vw,80px);padding:60px clamp(22px,6vw,90px)}
.copy h2{font-weight:400;letter-spacing:-.06em;line-height:1;font-size:clamp(44px,6.5vw,86px);margin:0 0 18px}
.copy p{font-size:18px;max-width:440px;margin:0 0 22px}
.seg{display:inline-flex;margin-right:10px}
button{font:bold 11px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;border:0;padding:13px 17px;cursor:pointer;background:transparent;color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);transition:background .2s,color .2s}
button:hover,button[aria-pressed=true]{background:var(--navy);color:var(--cream)}
.hint{font:bold 11px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--navy-light);margin-top:22px;opacity:0}
.puzzle{position:relative;width:min(46vh,40vw,400px);aspect-ratio:600/900;pointer-events:none}
.puzzle.live{pointer-events:auto}
.piece{position:absolute;display:block;will-change:transform;opacity:0;-webkit-tap-highlight-color:transparent}
.live .piece{cursor:pointer}
.piece img{display:block;width:100%;height:auto;pointer-events:none}
.piece:focus-visible{outline:3px solid var(--navy);outline-offset:4px}
.lbl{position:absolute;transform:translate(-50%,-50%);width:88px;padding:6px 4px;background:var(--navy);color:var(--beige);font:bold 10px Arial,sans-serif;letter-spacing:.1em;text-align:center;text-transform:uppercase;pointer-events:none}
.p-tl{top:0;left:0;width:77.67%}.p-tr{top:0;left:33.33%;width:66.67%}.p-ml{top:15.33%;left:0;width:66.67%}.p-mr{top:15.33%;left:22.33%;width:77.67%}.p-bl{top:48.67%;left:0;width:66.67%}.p-br{top:56%;left:22.33%;width:77.67%}
.p-tl .lbl{top:22%;left:28%}.p-tr .lbl{top:22%;left:74%}.p-ml .lbl{top:50%;left:22%}.p-mr .lbl{top:50%;left:78%}.p-bl .lbl{top:78%;left:28%}.p-br .lbl{top:78%;left:74%}
.veil{position:fixed;inset:0;z-index:50;visibility:hidden;display:grid;place-items:center;padding:calc(70px + env(safe-area-inset-top,0px)) clamp(22px,6vw,90px) calc(40px + env(safe-area-inset-bottom,0px));overflow:auto}
.veil .in{max-width:900px;width:100%}
.veil .eb{font:bold 11px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.veil h3{font-weight:400;letter-spacing:-.06em;line-height:.96;font-size:clamp(46px,9vw,120px);margin:14px 0 18px}
.veil p{font-size:20px;max-width:560px;margin:0 0 26px}
.chips{display:flex;flex-wrap:wrap;gap:10px}.chips span{padding:12px 16px;border:1px solid currentColor;font:bold 11px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.veil .back{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));left:clamp(22px,6vw,90px);box-shadow:inset 0 0 0 1px currentColor;color:inherit}
.veil .back:hover{background:currentColor}.veil .back:hover b{color:var(--c)}
@media(max-width:720px){.scene{grid-template-columns:1fr;justify-items:center;text-align:center}.puzzle{width:min(62vw,300px)}.copy p{margin-inline:auto}}
:root:not([data-theme=light]){color-scheme:light}
</style></head><body>
<section class="hero"><h1>Trying to connect the pieces of me<br><em>to uncover the hidden picture</em></h1><span>Scroll ↓ the pieces assemble when you arrive</span></section>
<section class="scene" id="scene">
 <div class="copy"><h2>Pieces of my story<br><em>pick one.</em></h2><p>Each piece opens its own page. Choose how it travels there:</p>
  <div><span class="seg"><button id="mz" aria-pressed="true">Zoom in</button><button id="ms" aria-pressed="false">Spin off</button></span><button id="re">Replay intro</button></div>
  <div class="hint" id="hint">Tap a piece · Esc to go back</div></div>
 <div class="puzzle" id="pz"></div>
</section>
<div class="veil" id="veil"></div>

    .to(others(k),{opacity:0,scale:.7,rotation:()=>gsap.utils.random(-25,25),duration:.5*T,stagger:.04*T,ease:'power2.in'},'<');
  if(mode==='zoom'){
    const sc=Math.max(vw/a.offsetWidth,vh/a.offsetHeight)*1.3;
    tl.to(a,{x:x0+vw/2-cx,y:y0+vh/2-cy,scale:sc,rotation:0,duration:1.1*T,ease:'power3.in'})
      .to(veil,{autoAlpha:1,duration:.35*T},'-=.35');
  }else{
    tl.to(a,{x:x0+vw*.6,y:y0-vh*.3,rotation:720,scale:.15,opacity:0,duration:1*T,ease:'power2.in'})
      .fromTo(veil,{autoAlpha:1,clipPath:'circle(0px at '+cx+'px '+cy+'px)'},{clipPath:'circle('+Math.hypot(vw,vh)+'px at '+cx+'px '+cy+'px)',duration:1*T,ease:'power2.inOut'},'<.15');
  }
  tl.from(veil.querySelectorAll('[data-in]'),{y:40,opacity:0,stagger:.09*T,duration:.6*T,ease:'power3.out'});
}
function close(){
  if(!openKey)return;const k=openKey,a=S[k].a,[cx,cy]=origin;openKey=null;
  const tl=gsap.timeline({onComplete:()=>{a.style.zIndex='';document.documentElement.style.overflow='';ready=true}});
  tl.to(veil.querySelectorAll('[data-in]'),{y:-30,opacity:0,duration:.25*T,stagger:.03*T});
  if(openMode==='zoom'){
    tl.to(veil,{autoAlpha:0,duration:.4*T}).to(a,{x:0,y:0,scale:1,rotation:0,duration:1*T,ease:'power3.inOut'});
  }else{
    tl.to(veil,{clipPath:'circle(0px at '+cx+'px '+cy+'px)',duration:.8*T,ease:'power2.inOut'}).set(veil,{autoAlpha:0})
      .to(a,{x:0,y:0,rotation:0,scale:1,opacity:1,duration:1*T,ease:'back.out(1.3)'},'<-.4');
  }
  tl.to(others(k),{opacity:1,scale:1,rotation:0,duration:.6*T,stagger:.05*T,ease:'back.out(1.5)'},'-=.5');
}
veil.onclick=e=>{if(e.target.closest('[data-back]'))close()};
addEventListener('keydown',e=>{if(e.key==='Escape')close()});
const setMode=m=>{mode=m;$('mz').setAttribute('aria-pressed',m==='zoom');$('ms').setAttribute('aria-pressed',m==='spin')};
$('mz').onclick=()=>setMode('zoom');$('ms').onclick=()=>setMode('spin');
$('re').onclick=()=>{if(!openKey&&ready)intro()};
</script></body></html>
